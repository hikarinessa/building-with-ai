<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img">
  <defs>
    <marker id="ah9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <text class="lab" x="40" y="30">a timeout is an unknown</text>
  <!-- boxes -->
  <rect class="box ac" x="40" y="80" width="180" height="100" rx="8"/>
  <text x="130" y="122" text-anchor="middle">your server</text>
  <text class="mu" x="130" y="146" text-anchor="middle">waiting for an answer</text>
  <rect class="box" x="580" y="80" width="180" height="100" rx="8"/>
  <text x="670" y="122" text-anchor="middle">their service</text>
  <text class="mu" x="670" y="146" text-anchor="middle">may already have acted</text>
  <!-- request -->
  <line class="ln" x1="220" y1="104" x2="578" y2="104" marker-end="url(#ah9)"/>
  <text class="mu" x="400" y="94" text-anchor="middle">request — charge this customer</text>
  <!-- response, cut -->
  <line class="ln mu" x1="580" y1="156" x2="440" y2="156"/>
  <line class="ln mu dash" x1="360" y1="156" x2="222" y2="156" marker-end="url(#ah9)"/>
  <line class="ln ac" x1="392" y1="142" x2="408" y2="170"/>
  <line class="ln ac" x1="408" y1="142" x2="392" y2="170"/>
  <text class="mu" x="400" y="190" text-anchor="middle">response — never arrives</text>
  <!-- question marks -->
  <text class="ac" x="130" y="220" text-anchor="middle">did it happen?</text>
  <text class="mu" x="130" y="240" text-anchor="middle">retrying may do it twice</text>
  <text class="ac" x="670" y="220" text-anchor="middle">did they get the answer?</text>
  <text class="mu" x="670" y="240" text-anchor="middle">a repeat looks like a new order</text>
</svg>
