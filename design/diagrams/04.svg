<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" role="img">
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <text class="lab" x="40" y="30">the five stops of one write</text>
  <!-- stops -->
  <rect class="box" x="40" y="90" width="120" height="60" rx="6"/>
  <text x="100" y="118" text-anchor="middle">1 · Interface</text>
  <text class="mu" x="100" y="138" text-anchor="middle">composes it</text>
  <rect class="box ac" x="220" y="90" width="120" height="60" rx="6"/>
  <text x="280" y="118" text-anchor="middle">2 · Route</text>
  <text class="mu" x="280" y="138" text-anchor="middle">receives it</text>
  <rect class="box ac" x="380" y="90" width="120" height="60" rx="6"/>
  <text x="440" y="118" text-anchor="middle">3 · Logic</text>
  <text class="mu" x="440" y="138" text-anchor="middle">applies the rules</text>
  <rect class="box ac" x="540" y="90" width="120" height="60" rx="6"/>
  <text x="600" y="118" text-anchor="middle">4 · Data access</text>
  <text class="mu" x="600" y="138" text-anchor="middle">reads and writes</text>
  <rect class="box" x="700" y="90" width="80" height="60" rx="6"/>
  <text x="740" y="118" text-anchor="middle">5 · Row</text>
  <text class="mu" x="740" y="138" text-anchor="middle">changed</text>
  <!-- arrows -->
  <line class="ln" x1="160" y1="120" x2="218" y2="120" marker-end="url(#ah4)"/>
  <line class="ln" x1="340" y1="120" x2="378" y2="120" marker-end="url(#ah4)"/>
  <line class="ln" x1="500" y1="120" x2="538" y2="120" marker-end="url(#ah4)"/>
  <line class="ln" x1="660" y1="120" x2="698" y2="120" marker-end="url(#ah4)"/>
  <!-- the wire -->
  <line class="ln ac dash" x1="190" y1="60" x2="190" y2="240"/>
  <text class="ac" x="190" y="54" text-anchor="middle">the wire</text>
  <!-- response back -->
  <path class="ln mu" d="M740 152 C740 215, 100 215, 100 154" fill="none" marker-end="url(#ah4)"/>
  <text class="mu" x="420" y="210" text-anchor="middle">the response returns, and the interface updates from it</text>
  <!-- evidence -->
  <text class="lab" x="40" y="262">evidence at each stop</text>
  <text class="mu" x="100" y="284" text-anchor="middle">the network tab</text>
  <text class="mu" x="360" y="284" text-anchor="middle">the route's logs</text>
  <text class="mu" x="740" y="284" text-anchor="middle">the rows</text>
</svg>
