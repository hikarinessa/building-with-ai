<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img">
  <defs>
    <marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <text class="lab" x="40" y="30">the hosting axis</text>
  <!-- the two slopes -->
  <line class="ln ac" x1="80" y1="70" x2="720" y2="130"/>
  <text class="ac" x="80" y="60">cost per use</text>
  <text class="mu" x="80" y="150">grows with success</text>
  <line class="ln mu" x1="80" y1="130" x2="720" y2="70"/>
  <text x="720" y="60" text-anchor="end">maintenance</text>
  <text class="mu" x="720" y="150" text-anchor="end">you own the pager</text>
  <!-- axis -->
  <line class="ln" x1="40" y1="200" x2="760" y2="200" marker-end="url(#ah5)" marker-start="url(#ah5)"/>
  <text class="lab" x="40" y="236">decided for you</text>
  <text class="lab" x="760" y="236" text-anchor="end">yours to run</text>
  <!-- ticks -->
  <line class="ln" x1="110" y1="192" x2="110" y2="208"/>
  <text x="110" y="270" text-anchor="middle">managed frontend</text>
  <line class="ln" x1="255" y1="192" x2="255" y2="208"/>
  <text x="255" y="270" text-anchor="middle">app platform</text>
  <line class="ln" x1="400" y1="192" x2="400" y2="208"/>
  <text x="400" y="270" text-anchor="middle">backend-as-a-service</text>
  <line class="ln" x1="545" y1="192" x2="545" y2="208"/>
  <text x="545" y="270" text-anchor="middle">rented box</text>
  <line class="ln" x1="690" y1="192" x2="690" y2="208"/>
  <text x="690" y="270" text-anchor="middle">cloud primitives</text>
</svg>
